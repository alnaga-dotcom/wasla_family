# Render blueprint for Wasla backend
# 1. Create a new Web Service on render.com
# 2. Connect this repo and use this blueprint, OR deploy manually with the Dockerfile.
# 3. Set the environment variables below in the Render dashboard.
services:
  - type: web
    name: wasla-api
    runtime: docker
    repo: https://github.com/YOUR_REPO/wasla
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: WASLA_PUBLIC_DOMAIN
        value: https://wasla.family
      - key: WASLA_CORS_ORIGINS
        value: https://wasla.family,https://www.wasla.family,https://app.wasla.family
      - key: WASLA_ADMIN_KEY
        generateValue: true
      - key: WASLA_TRUST_PROXY
        value: "1"
      - key: WASLA_UPLOADS_DIR
        value: /app/data/uploads
      - key: WASLA_DEV_OTP
        value: "false"
      - key: LOG_LEVEL
        value: info
      # REQUIRED for production boot: pick twilio, email or whatsapp and fill the matching
      # credentials below (empty creds will crash startup with a clear error).
      # Switch to whatsapp ONLY after WHATSAPP_PHONE_NUMBER_ID and WHATSAPP_TOKEN
      # are set in the Render dashboard.
      - key: WASLA_OTP_PROVIDER
        value: email
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # WhatsApp Cloud API (for WASLA_OTP_PROVIDER=whatsapp)
      # Phone Number ID from Meta Developer -> WhatsApp -> API Setup
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      # Permanent system-user token with whatsapp_business_messaging permission
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        value: wasla_otp
      - key: WHATSAPP_LANGUAGE
        value: ar
      - key: WHATSAPP_API_VERSION
        value: v21.0
      # Must match the webhook "Verify token" configured in Meta
      - key: WHATSAPP_VERIFY_TOKEN
        value: wasla_verify_2026
      # Payments: keep 'mock' until 066.city credentials are configured
      - key: WASLA_PAYMENT_PROVIDER
        value: mock
      - key: WASLA_066_MERCHANT_ID
        sync: false
      - key: WASLA_066_API_KEY
        sync: false
      - key: WASLA_066_SECRET
        sync: false
      - key: WASLA_066_BASE_URL
        value: https://api.066.city
    healthCheckPath: /api/health
    disk:
      name: wasla-data
      mountPath: /app/data
      sizeGB: 1
